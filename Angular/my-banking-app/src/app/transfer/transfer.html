<div class="card transfer-card">
  <div class="section-header">
    <h2>Fund Transfer</h2>
    <p class="subheading">Send money securely to another account in just a few steps.</p>
  </div>

  <form [formGroup]="transferForm" (ngSubmit)="transfer()" class="form-grid">
    <div class="field">
      <label>From Account</label>
      <input formControlName="fromAccount" placeholder="Enter source account" />
    </div>

    <div class="field">
      <label>To Account</label>
      <input formControlName="toAccount" placeholder="Enter destination account" />
    </div>

    <div class="field">
      <label>Amount</label>
      <input type="number" formControlName="amount" placeholder="Enter amount" />
      <div *ngIf="transferForm.get('amount')?.errors?.['min']" class="error">
        Minimum transfer amount is ₹100.
      </div>
      <div *ngIf="transferForm.get('amount')?.valid && insufficientFunds" class="error">
        Insufficient balance for this transfer.
      </div>
    </div>

    <button type="submit" class="btn btn-primary" [disabled]="transferForm.invalid || insufficientFunds">Transfer</button>
  </form>

  <div *ngIf="message" class="note">{{ message }}</div>
</div>
