<div class="app-shell">
  <header class="app-header">
    <div>
      <h1 class="app-title">Mirchi Bank</h1>
      <p class="app-subtitle">Manage your account, transfer funds, and review transaction history.</p>
    </div>
    <nav class="main-nav">
      <a routerLink="/login" *ngIf="!authService.isLoggedIn()">Login</a>
      <a routerLink="/dashboard" *ngIf="authService.isLoggedIn()">Dashboard</a>
      <a routerLink="/transactions" *ngIf="authService.isLoggedIn()">Transactions</a>
      <a routerLink="/transfer" *ngIf="authService.isLoggedIn()">Transfer</a>
      <button class="btn btn-ghost" *ngIf="authService.isLoggedIn()" (click)="logout()">Logout</button>
    </nav>
  </header>
  <main class="page-content">
    <router-outlet></router-outlet>
  </main>
</div>
