server:
  port: 8080

spring:
  application:
    name: strangler-fig-gateway
  cloud:
    gateway:
      routes:
        # NEW: forward all /orders/** traffic to the new microservice
        - id: orders-service
          uri: http://localhost:8081
          predicates:
            - Path=/orders/**

        # LEGACY: keep /inventory/** on the old monolith for now
        - id: legacy-inventory
          uri: http://localhost:9090
          predicates:
            - Path=/inventory/**
