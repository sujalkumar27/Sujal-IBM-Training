server.port=8081

# ---- H2 in-memory database ---------------------------------------------
# 'testdb' is the DB name; DB_CLOSE_DELAY=-1 keeps it alive while the JVM runs.
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ---- JPA / Hibernate ---------------------------------------------------
# create-drop: recreate schema on startup, drop on shutdown (dev only)
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ---- H2 web console ----------------------------------------------------
# Open http://localhost:8081/h2-console
# JDBC URL to enter: jdbc:h2:mem:testdb
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Load data.sql AFTER Hibernate creates the schema
spring.jpa.defer-datasource-initialization=true
