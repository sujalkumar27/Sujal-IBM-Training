<div class="card login-card">
  <div class="section-header">
    <h2>Welcome back</h2>
    <p class="subheading">Sign in to access your dashboard, transfer funds, and view your recent activity.</p>
  </div>

  <form [formGroup]="loginForm" (ngSubmit)="login()" class="form-grid">
    <div class="field">
      <label>Username</label>
      <input formControlName="username" placeholder="Enter username" />
    </div>

    <div class="field">
      <label>Password</label>
      <input type="password" formControlName="password" placeholder="Enter password" />
    </div>

    <button type="submit" class="btn btn-primary">Login</button>
  </form>

  <p class="note">Use <strong>user</strong> / <strong>user</strong> to sign in.</p>

  <div *ngIf="error" class="error">{{ error }}</div>
</div>
