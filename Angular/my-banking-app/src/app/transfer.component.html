<h2>Fund Transfer</h2>
<form [formGroup]="transferForm" (ngSubmit)="transfer()">

  <label>From Account</label>
  <input formControlName="fromAccount">

  <br><br>

  <label>To Account</label>
  <input formControlName="toAccount">

  <br><br>

  <label>Amount</label>
  <input type="number" formControlName="amount">

  <div *ngIf="transferForm.controls.amount.errors?.['min']">
    Minimum transfer amount is ₹100.
  </div>

  <br>

  <button type="submit">
    Transfer
  </button>

</form>
