<h2>Fund Transfer</h2>

<form
[formGroup]="transferForm"
(ngSubmit)="transfer()">

<label>

From Account

</label>

<br>

<input
formControlName="fromAccount">

<br><br>

<label>

To Account

</label>

<br>

<input
formControlName="toAccount">

<br><br>

<label>

Amount

</label>

<br>

<input
type="number"
formControlName="amount">

<div
*ngIf="transferForm.get('amount')?.errors?.['min']">

Minimum Transfer Amount is ₹100

</div>

<br><br>

<h3>

Beneficiaries

</h3>

<div formArrayName="beneficiaries">

<div
*ngFor="let b of beneficiaries.controls; let i=index">

<input
[formControlName]="i">

</div>

</div>

<br>

<button
type="button"
(click)="addBeneficiary()">

Add Beneficiary

</button>

<br><br>

<button
type="submit">

Transfer

</button>

</form>

<hr>

<p>

{{message}}

</p>
